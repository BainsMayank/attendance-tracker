<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit class</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:#F6F7FB;--sf:#FFFFFF;--sr:#ECEEF5;--t1:#171923;--t2:#52586A;--sep:#D9DDE8;--ac:#4144D8;--onac:#FFFFFF;--acs:#EEEEFF;--ok:#176640;--oks:#E8F5ED;--bad:#B42338;--bads:#FDECEF;--warn:#805800;--warns:#FFF4D8;--neu:#535D73;--neus:#EEF0F5;position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app.dark{--bg:#101116;--sf:#1B1D26;--sr:#272A36;--t1:#F5F6FC;--t2:#B3B8CB;--sep:#383D4D;--ac:#B2B4FF;--onac:#18194A;--acs:#292B4E;--ok:#7ED6A3;--oks:#173728;--bad:#FF9CA9;--bads:#45222B;--warn:#F1CA72;--warns:#3D321D;--neu:#B6BFD5;--neus:#292F3C}
.app *{box-sizing:border-box}
.app button,.app input,.app select{font:inherit;color:inherit}
.app button{cursor:pointer}
a{color:var(--ac);text-decoration:none}a:hover{color:var(--ac)}
.cap{font-size:13px;line-height:18px;font-weight:500;color:var(--t2)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gh{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin:8px 16px -8px}
.grp{background:var(--sf);border-radius:16px;overflow:hidden}
.f{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 16px;border-top:.5px solid var(--sep);font-size:16px}
.f:first-child{border-top:0}
.f>.l{flex:none;width:96px;font-weight:500}
.f input,.f select{flex:1;min-width:0;height:40px;border:0;background:none;font-size:16px;text-align:right;outline:none}
.f input::placeholder{color:var(--t2)}
.seg{display:flex;flex:1;background:var(--sr);border-radius:10px;padding:2px}
.seg button{flex:1;height:36px;border:0;background:none;border-radius:8px;font-size:14px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--sf);color:var(--t1);box-shadow:0 1px 3px rgba(20,22,40,.14)}
.dchip{width:44px;height:44px;border-radius:22px;border:1px solid var(--sep);background:none;font-size:14px;font-weight:700}
.dchip.on{background:var(--ac);color:var(--onac) !important;border-color:var(--ac)}
.stp{width:44px;height:36px;border:0;border-radius:10px;background:var(--sr);display:flex;align-items:center;justify-content:center}
.rad{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 16px;border:0;background:none;text-align:left;border-top:.5px solid var(--sep)}
.rad:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--t2);flex:none;display:flex;align-items:center;justify-content:center}
.dot.on{border-color:var(--ac)}
.dot.on::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--ac)}
</style>
</helmet>
<div class="app {{themeClass}}" style="width: 390px; height: 1220px">
  <header style="padding: 54px 8px 0; height: 104px; display: flex; align-items: center; justify-content: space-between">
    <a href="Timetable.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 10px; font-size: 17px">Cancel</a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">Edit class</h1>
    <a href="Timetable.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 10px; font-size: 17px; font-weight: 700; opacity: {{saveOp}}" aria-disabled="{{clash}}">Save</a>
  </header>

  <main style="padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 16px">
    <div class="gh">Class</div>
    <div class="grp">
      <label class="f"><span class="l">Subject</span>
        <select aria-label="Subject" style="appearance: none; color: var(--ac); font-weight: 600">
          <option>Operating Systems</option><option>Data Structures &amp; Algorithms</option><option>Discrete Mathematics</option><option>Digital Logic Lab</option><option>Economics for Engineers</option><option>Technical Writing</option>
        </select>
      </label>
      <div class="f"><span class="l">Type</span>
        <div class="seg" role="radiogroup" aria-label="Class type">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
        </div>
      </div>
      <div class="f"><span class="l">Counts as</span>
        <span style="flex: 1; text-align: right; font-weight: 600">{{countsLabel}}</span>
        <button class="stp" aria-label="Count as fewer classes" onClick="{{dec}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M5 12h14"></path></svg></button>
        <button class="stp" aria-label="Count as more classes" onClick="{{inc}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>
    <div class="cap" style="margin: -8px 16px 0">Some colleges count a 3-hour lab as 3 classes. Leave it at 1 if yours doesn’t.</div>

    <div class="gh">When</div>
    <div class="grp">
      <div class="f" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px">
        <span class="l" id="dayl">Day</span>
        <div role="radiogroup" aria-labelledby="dayl" style="display: flex; justify-content: space-between">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="6"><button class="{{d.cls}}" role="radio" aria-checked="{{d.on}}" aria-label="{{d.full}}" onClick="{{d.pick}}">{{d.short}}</button></sc-for>
        </div>
      </div>
      <label class="f"><span class="l">Starts</span><input type="time" value="{{start}}" onChange="{{onStart}}"></label>
      <label class="f"><span class="l">Ends</span><input type="time" value="{{end}}" onChange="{{onEnd}}"></label>
      <div class="f"><span class="l">Repeats</span>
        <div class="seg" role="radiogroup" aria-label="Repeats">
          <sc-for list="{{reps}}" as="r" hint-placeholder-count="3"><button class="{{r.cls}}" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for>
        </div>
      </div>
    </div>
    <div role="status" style="display: flex; align-items: center; gap: 8px; margin: -6px 12px 0; font-size: 14px; font-weight: 600; color: {{clashColor}}">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{clashIcon}}"></path></svg>{{clashText}}
    </div>

    <div class="gh">Where</div>
    <div class="grp">
      <label class="f"><span class="l">Venue</span><input value="LH-204" placeholder="Room or building"></label>
      <label class="f"><span class="l">Teacher</span><input placeholder="Optional"></label>
    </div>

    <div class="gh">Apply changes</div>
    <div class="grp" role="radiogroup" aria-label="Apply changes">
      <button class="rad" role="radio" aria-checked="{{fromToday}}" onClick="{{pickToday}}"><span class="{{dotToday}}"></span><span><span style="display: block; font-size: 16px; font-weight: 600">From today onward</span><span class="cap">Past attendance stays exactly as logged</span></span></button>
      <button class="rad" role="radio" aria-checked="{{wholeSem}}" onClick="{{pickWhole}}"><span class="{{dotWhole}}"></span><span><span style="display: block; font-size: 16px; font-weight: 600">Whole semester</span><span class="cap">Rewrites past days too · marks are kept</span></span></button>
    </div>

    <button style="height: 52px; border: 0; border-radius: 16px; background: var(--sf); color: var(--bad); font-size: 17px; font-weight: 600; margin-top: 8px">Delete this class</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"$preview":{"width":390,"height":1220}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { type: 'Lecture', counts: 1, day: 0, start: '10:00', end: '10:55', rep: 'every', scope: 'today' };
  }
  renderVals() {
    const s = this.state;
    const others = [
      [['DSA', '09:00', '09:55'], ['DM', '11:10', '12:05'], ['Digital Logic Lab', '14:00', '16:45'], ['Economics', '16:50', '17:45']],
      [['Operating Systems', '09:00', '09:55'], ['Discrete Mathematics', '10:00', '10:55'], ['Economics', '11:10', '12:05'], ['Technical Writing', '14:00', '14:55']],
      [['DSA', '09:00', '09:55'], ['Discrete Mathematics', '10:00', '10:55'], ['DS Lab', '11:10', '13:00'], ['Economics', '15:00', '15:55']],
      [['Operating Systems', '09:00', '09:55'], ['Data Structures & Algorithms', '10:00', '10:55'], ['Digital Logic Lab', '14:00', '16:45']],
      [['Discrete Mathematics', '09:00', '09:55'], ['OS Tutorial', '10:00', '10:55'], ['Technical Writing', '11:10', '12:05'], ['Economics', '14:00', '14:55']],
      []
    ];
    const mins = (t) => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
    const a = mins(s.start), b = mins(s.end);
    const bad = b <= a;
    const hit = others[s.day].find(([, x, y]) => mins(x) < b && a < mins(y));
    const fullDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const clash = bad || !!hit;
    return {
      themeClass: (this.props.theme ?? 'Light') === 'Dark' ? 'dark' : '',
      types: ['Lecture', 'Tutorial', 'Lab'].map((label) => ({ label, on: s.type === label, cls: s.type === label ? 'on' : '', pick: () => this.setState({ type: label }) })),
      countsLabel: s.counts + (s.counts === 1 ? ' class' : ' classes'),
      inc: () => this.setState((st) => ({ counts: Math.min(6, st.counts + 1) })),
      dec: () => this.setState((st) => ({ counts: Math.max(1, st.counts - 1) })),
      days: ['M', 'T', 'W', 'T', 'F', 'S'].map((short, i) => ({ short, full: fullDays[i], on: s.day === i, cls: s.day === i ? 'dchip on' : 'dchip', pick: () => this.setState({ day: i }) })),
      start: s.start, end: s.end,
      onStart: (e) => this.setState({ start: e.target.value }),
      onEnd: (e) => this.setState({ end: e.target.value }),
      reps: [['every', 'Weekly'], ['odd', 'Odd wks'], ['even', 'Even wks']].map(([k, label]) => ({ label, on: s.rep === k, cls: s.rep === k ? 'on' : '', pick: () => this.setState({ rep: k }) })),
      clash,
      clashText: bad ? 'End time must be after the start time' : hit ? 'Overlaps ' + hit[0] + ' (' + hit[1] + '–' + hit[2] + ') on ' + fullDays[s.day] : 'No overlap with other ' + fullDays[s.day] + ' classes',
      clashColor: clash ? 'var(--bad)' : 'var(--ok)',
      clashIcon: clash ? 'M12 8v5M12 16.5h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z' : 'M5 12.5l4.5 4.5L19 7.5',
      saveOp: clash ? '0.4' : '1',
      fromToday: s.scope === 'today', wholeSem: s.scope === 'whole',
      dotToday: s.scope === 'today' ? 'dot on' : 'dot', dotWhole: s.scope === 'whole' ? 'dot on' : 'dot',
      pickToday: () => this.setState({ scope: 'today' }), pickWhole: () => this.setState({ scope: 'whole' })
    };
  }
}
</script>
</body>
</html>
