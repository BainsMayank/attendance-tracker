<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subject files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:#F6F7FB;--sf:#FFFFFF;--sr:#ECEEF5;--t1:#171923;--t2:#52586A;--sep:#D9DDE8;--ac:#4144D8;--onac:#FFFFFF;--acs:#EEEEFF;--ok:#176640;--oks:#E8F5ED;--bad:#B42338;--bads:#FDECEF;--warn:#805800;--warns:#FFF4D8;--neu:#535D73;--neus:#EEF0F5;--bar:rgba(255,255,255,.86);position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app.dark{--bg:#101116;--sf:#1B1D26;--sr:#272A36;--t1:#F5F6FC;--t2:#B3B8CB;--sep:#383D4D;--ac:#B2B4FF;--onac:#18194A;--acs:#292B4E;--ok:#7ED6A3;--oks:#173728;--bad:#FF9CA9;--bads:#45222B;--warn:#F1CA72;--warns:#3D321D;--neu:#B6BFD5;--neus:#292F3C;--bar:rgba(27,29,38,.88)}
.app *{box-sizing:border-box}
.app button,.app input{font:inherit;color:inherit}
.app button{cursor:pointer}
a{color:var(--ac);text-decoration:none}a:hover{color:var(--ac)}
.card{background:var(--sf);border-radius:16px}
.cap{font-size:13px;line-height:18px;font-weight:500;color:var(--t2)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:var(--sf);color:var(--ac);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px var(--sep)}
.pill{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:600;line-height:18px;white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}
.seg{display:flex;background:var(--sr);border-radius:12px;padding:3px}
.seg a{flex:1;height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:14px;font-weight:600;color:var(--t2)}
.seg a.on{background:var(--sf);color:var(--t1);box-shadow:0 1px 3px rgba(20,22,40,.14)}
.fold{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border:0;border-radius:16px;background:var(--sf);text-align:left;min-height:112px}
.fold .fi{width:40px;height:40px;border-radius:12px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center}
.frow{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 4px 10px 14px;border-top:.5px solid var(--sep)}
.frow:first-child{border-top:0}
.badge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.3px;flex:none}
.badge.pdf{background:var(--bads);color:var(--bad)}.badge.img{background:var(--acs);color:var(--ac)}.badge.doc{background:var(--neus);color:var(--neu)}.badge.code{background:var(--oks);color:var(--ok)}
.more{width:44px;height:44px;border:0;background:none;color:var(--t2);display:flex;align-items:center;justify-content:center;flex:none}
.sec{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin:4px 4px -6px}
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:32px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 28px rgba(20,22,40,.14),0 0 0 .5px var(--sep);display:flex;padding:6px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;font-size:11px;font-weight:600;color:var(--t2) !important}
.tab.on{background:var(--acs);color:var(--ac) !important}
</style>
</helmet>
<div class="app {{themeClass}}" style="width: 390px; height: 1180px">
  <nav aria-label="Subject navigation" style="padding: 54px 12px 0 4px; height: 102px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; font-size: 17px">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Subjects
    </a>
    <a href="SubjectFilesAdd.dc.html" class="ib" aria-label="Add files or folder"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  </nav>

  <main style="padding: 0 16px 120px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div>
        <div class="cap">CS201</div>
        <h1 style="margin: 2px 0 0; font-size: 24px; line-height: 30px; font-weight: 700">Data Structures &amp; Algorithms</h1>
      </div>
      <span class="pill ok" style="margin-bottom: 4px">81.8%</span>
    </div>

    <div class="seg" role="tablist" aria-label="Subject sections">
      <a href="SubjectTopics.dc.html" role="tab" aria-selected="false">Topics</a>
      <a class="on" href="SubjectFiles.dc.html" role="tab" aria-selected="true">Files</a>
      <a href="SubjectStudy.dc.html" role="tab" aria-selected="false">Study</a>
    </div>

    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--sr); color: var(--t2)">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search files</span>
      <input placeholder="Search 17 files" style="flex: 1; border: 0; background: none; font-size: 16px; outline: none; height: 40px">
    </label>

    <sc-if value="{{atRoot}}" hint-placeholder-val="{{true}}">
      <div class="sec">Folders</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="4">
          <button class="fold" onClick="{{f.open}}">
            <span class="fi"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
            <span>
              <span style="display: block; font-size: 16px; font-weight: 600; line-height: 21px">{{f.name}}</span>
              <span class="cap">{{f.count}} items</span>
            </span>
          </button>
        </sc-for>
        <a href="SubjectFilesAdd.dc.html" class="fold" style="border: 1.5px dashed var(--sep); background: transparent; color: var(--ac); justify-content: center; align-items: center; gap: 6px">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M12 11v6M9 14h6"></path></svg>
          <span style="font-size: 15px; font-weight: 600">New folder</span>
        </a>
      </div>
      <div class="sec" style="margin-top: 8px">Recent</div>
    </sc-if>

    <sc-if value="{{inFolder}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 4px; font-size: 15px">
        <button onClick="{{goRoot}}" style="border: 0; background: none; color: var(--ac); font-weight: 600; height: 44px; padding: 0 4px">All files</button>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; color: var(--t2)"><path d="M9 5l7 7-7 7"></path></svg>
        <span style="font-weight: 600">{{folderName}}</span>
      </div>
    </sc-if>

    <section class="card" aria-label="Files" style="padding: 2px 0">
      <sc-for list="{{files}}" as="x" hint-placeholder-count="4">
        <div class="frow">
          <span class="{{x.badgeCls}}">{{x.ext}}</span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 16px; font-weight: 500; line-height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.name}}</div>
            <div class="cap">{{x.meta}}</div>
          </div>
          <button class="more" aria-label="More options for {{x.name}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></button>
        </div>
      </sc-for>
    </section>

    <div class="cap" style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.4 1.6A4 4 0 0 1 17.5 18.5z"></path></svg>
      Stored on this iPhone · backed up with iCloud · 38.6 MB
    </div>
  </main>

  <nav class="tabbar" aria-label="Tabs">
    <a class="tab on" href="Main.dc.html" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"></path></svg>Subjects</a>
    <a class="tab" href="DailyLog.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15l2 2 4-4"></path></svg>Daily Log</a>
    <a class="tab" href="Timetable.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect><path d="M3 9h18M9 3v18"></path></svg>Timetable</a>
    <a class="tab" href="Settings.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { folder: null };
  }
  renderVals() {
    const f = (name, ext, meta) => ({ name, ext, meta, badgeCls: 'badge ' + ({ PDF: 'pdf', JPG: 'img', PNG: 'img', DOC: 'doc', CPP: 'code' })[ext] });
    const data = {
      'Lecture Notes': [f('Unit 1 – Arrays.pdf', 'PDF', '1.8 MB · 4 Aug'), f('Unit 2 – Stacks & Queues.pdf', 'PDF', '2.1 MB · 1 Sep'), f('Unit 3 – Trees.pdf', 'PDF', '2.4 MB · Yesterday'), f('Board – AVL rotations.jpg', 'JPG', 'Photo · 3.2 MB · 9 Oct'), f('Scan – Heap notes.pdf', 'PDF', '3 pages · 1.1 MB · 6 Oct')],
      'Assignments': [f('Assignment 3 – Heaps.pdf', 'PDF', '420 KB · 24 Sep'), f('Assignment 4 – Graphs.docx', 'DOC', '86 KB · 8 Oct')],
      'Previous Year Papers': [f('Mid-semester 2025.pdf', 'PDF', '640 KB'), f('End-semester 2025.pdf', 'PDF', '910 KB'), f('End-semester 2024.pdf', 'PDF', '880 KB')],
      'Lab Records': [f('Lab 5 – BST insert & delete.cpp', 'CPP', '6 KB · 30 Sep'), f('Lab 6 – Heap sort.cpp', 'CPP', '4 KB · 7 Oct'), f('Lab record – front page.png', 'PNG', 'Photo · 1.4 MB')]
    };
    const cur = this.state.folder;
    const folders = Object.keys(data).map((name) => ({ name, count: data[name].length, open: () => this.setState({ folder: name }) }));
    const recent = [
      { ...data['Lecture Notes'][2], meta: 'Lecture Notes · 2.4 MB · Yesterday' },
      data['Lecture Notes'][3],
      { ...data['Assignments'][1], meta: 'Assignments · 86 KB · 8 Oct' },
      data['Lecture Notes'][4]
    ];
    return {
      themeClass: (this.props.theme ?? 'Light') === 'Dark' ? 'dark' : '',
      atRoot: !cur, inFolder: !!cur, folderName: cur || '',
      folders, files: cur ? data[cur] : recent,
      goRoot: () => this.setState({ folder: null })
    };
  }
}
</script>
</body>
</html>
