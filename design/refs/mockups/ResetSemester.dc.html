<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset semester</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:#F6F7FB;--sf:#FFFFFF;--sr:#ECEEF5;--t1:#171923;--t2:#52586A;--sep:#D9DDE8;--ac:#4144D8;--onac:#FFFFFF;--acs:#EEEEFF;--ok:#176640;--oks:#E8F5ED;--bad:#B42338;--bads:#FDECEF;--warn:#805800;--warns:#FFF4D8;--neu:#535D73;--neus:#EEF0F5;position:relative;overflow:hidden;box-sizing:border-box;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app.dark{--bg:#101116;--sf:#1B1D26;--sr:#272A36;--t1:#F5F6FC;--t2:#B3B8CB;--sep:#383D4D;--ac:#B2B4FF;--onac:#18194A;--acs:#292B4E;--ok:#7ED6A3;--oks:#173728;--bad:#FF9CA9;--bads:#45222B;--warn:#F1CA72;--warns:#3D321D;--neu:#B6BFD5;--neus:#292F3C}
.app *{box-sizing:border-box}
.app button,.app input{font:inherit;color:inherit}
.app button{cursor:pointer}
.app button:disabled{cursor:default}
a{color:var(--ac);text-decoration:none}a:hover{color:var(--ac)}
.cap{font-size:13px;line-height:18px;font-weight:500;color:var(--t2)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grp{background:var(--sf);border-radius:16px;overflow:hidden}
.li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:21px}
.opt{width:100%;text-align:left;border:1.5px solid var(--sep);background:var(--sf);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt.on{border-color:var(--ac);background:var(--acs)}
.dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--t2);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt.on .dot{border-color:var(--ac)}
.opt.on .dot::after{content:"";width:12px;height:12px;border-radius:6px;background:var(--ac)}
.num{width:26px;height:26px;border-radius:13px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sr)}
.num.done{background:var(--ok);color:var(--onac)}
.btn{height:50px;border-radius:14px;border:0;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.ck{display:flex;align-items:center;gap:12px;min-height:44px;border:0;background:none;padding:0;font-size:15px;text-align:left}
.ck .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--t2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--onac)}
.ck .box svg{opacity:0}
.ck.on .box{background:var(--ac);border-color:var(--ac)}
.ck.on .box svg{opacity:1}
</style>
</helmet>
<div class="app {{themeClass}}" style="width: 390px; height: 1060px">
  <nav style="padding: 54px 12px 0 4px; height: 102px; display: flex; align-items: center">
    <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; font-size: 17px">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Settings
    </a>
  </nav>
  <main style="padding: 0 16px 40px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0 4px; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.3px">Reset semester</h1>

    <div role="radiogroup" aria-label="What to do" style="display: flex; flex-direction: column; gap: 8px">
      <button class="{{clearCls}}" role="radio" aria-checked="{{isClear}}" onClick="{{pickClear}}"><span class="dot"></span><span><span style="display: block; font-size: 16px; font-weight: 600">Clear attendance only</span><span class="cap">Start counting Fall 2026 from zero</span></span></button>
      <button class="{{newCls}}" role="radio" aria-checked="{{isNew}}" onClick="{{pickNew}}"><span class="dot"></span><span><span style="display: block; font-size: 16px; font-weight: 600">Start a new semester</span><span class="cap">Archive Fall 2026 as read-only history</span></span></button>
    </div>

    <section class="grp" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div class="li" style="color: var(--bad); font-weight: 600"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>{{removes}}</span></div>
      <div class="li"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; color: var(--ok)"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>{{keeps}}</span></div>
    </section>

    <section class="grp" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 10px; align-items: center"><span class="{{n1}}">1</span><b style="font-size: 16px">Save a backup first</b></div>
      <button class="btn" onClick="{{backup}}" style="background: {{bkBg}}; color: {{bkFg}}">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{bkIcon}}"></path></svg>{{bkLabel}}
      </button>
      <button class="{{skipCls}}" role="checkbox" aria-checked="{{skip}}" onClick="{{toggleSkip}}">
        <span class="box"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 3"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        I don’t need a backup
      </button>
    </section>

    <section class="grp" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; opacity: {{s2op}}">
      <div style="display: flex; gap: 10px; align-items: center"><span class="{{n2}}">2</span><b style="font-size: 16px">Type RESET to confirm</b></div>
      <label>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Type RESET to confirm</span>
        <input value="{{typed}}" onChange="{{onType}}" disabled="{{locked}}" autocapitalize="characters" autocomplete="off" placeholder="RESET" style="width: 100%; height: 50px; border-radius: 12px; border: 1.5px solid {{inputBorder}}; background: var(--bg); padding: 0 14px; font-size: 17px; font-weight: 600; letter-spacing: 2px; outline: none">
      </label>
    </section>

    <button class="btn" disabled="{{notReady}}" style="background: {{goBg}}; color: {{goFg}}; height: 54px; font-size: 17px">{{goLabel}}</button>
    <a href="Settings.dc.html" style="align-self: center; height: 44px; display: flex; align-items: center; font-size: 16px; font-weight: 600">Cancel</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Light","Dark"],"default":"Light"},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { mode: 'clear', backed: false, skip: false, typed: '' };
  }
  renderVals() {
    const s = this.state;
    const step1 = s.backed || s.skip;
    const match = s.typed.trim().toUpperCase() === 'RESET';
    const ready = step1 && match;
    const clear = s.mode === 'clear';
    return {
      themeClass: (this.props.theme ?? 'Light') === 'Dark' ? 'dark' : '',
      isClear: clear, isNew: !clear,
      clearCls: clear ? 'opt on' : 'opt', newCls: clear ? 'opt' : 'opt on',
      pickClear: () => this.setState({ mode: 'clear' }), pickNew: () => this.setState({ mode: 'new' }),
      removes: clear ? 'Removes 103 attendance marks across 6 subjects' : 'Ends Fall 2026 and removes it from the Subjects tab',
      keeps: clear ? 'Keeps subjects, timetable, topics, files and notes' : 'Copies subjects and timetable into the new semester; Fall 2026 stays in history',
      n1: step1 ? 'num done' : 'num', n2: match && step1 ? 'num done' : 'num',
      backup: () => this.setState({ backed: true }),
      bkBg: s.backed ? 'var(--oks)' : 'var(--acs)', bkFg: s.backed ? 'var(--ok)' : 'var(--ac)',
      bkIcon: s.backed ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 4v11M7 10l5 5 5-5M5 20h14',
      bkLabel: s.backed ? 'Saved to Files · Fall-2026-backup.json' : 'Save backup to Files',
      skip: s.skip, skipCls: s.skip ? 'ck on' : 'ck', toggleSkip: () => this.setState({ skip: !s.skip }),
      s2op: step1 ? '1' : '0.5', locked: !step1,
      typed: s.typed, onType: (e) => this.setState({ typed: e.target.value }),
      inputBorder: match ? 'var(--bad)' : 'var(--sep)',
      notReady: !ready,
      goBg: ready ? 'var(--bad)' : 'var(--sr)', goFg: ready ? 'var(--onac)' : 'var(--t2)',
      goLabel: clear ? 'Reset attendance' : 'Archive and start new semester'
    };
  }
}
</script>
</body>
</html>
